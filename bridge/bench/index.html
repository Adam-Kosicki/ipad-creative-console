<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Swipe bench</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#06080b;color:#eee;font:20px -apple-system,Helvetica,sans-serif;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#pager{position:absolute;left:0;top:0;width:100%;height:100%}
.page{position:absolute;left:0;top:0;width:100vw;height:100vh;box-sizing:border-box;padding:12px}
.card{display:inline-block;width:23%;height:30%;margin:1%;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);vertical-align:top;overflow:hidden}
.big{font-size:140px;font-weight:200;padding:40px}
/* native mode: browser scrolling, no JS at all */
body.native #pager{overflow-x:scroll;overflow-y:hidden;-webkit-overflow-scrolling:touch;white-space:nowrap;position:absolute}
body.native .page{position:relative;display:inline-block;vertical-align:top}
#mode{position:fixed;right:10px;bottom:6px;font-size:12px;color:#8a94a3;z-index:5}
</style></head><body>
<div id="pager"></div><div id="mode"></div>
<script>
(function () {
  var q = location.search, mode = (/m=([\w-]+)/.exec(q) || [0, 'js'])[1], N = 6, W = innerWidth;
  document.getElementById('mode').textContent = mode;
  var colors = ['#0f2a2a', '#1b1a33', '#2a1a1a', '#1a2a14', '#2a2414', '#14242f'];
  var pager = document.getElementById('pager');
  var heavy = mode.indexOf('heavy') >= 0, native = mode === 'native';
  if (native) document.body.className = 'native';
  for (var i = 0; i < N; i++) {
    var pg = document.createElement('div'); pg.className = 'page'; pg.style.background = colors[i];
    var html = '<div class="big">' + (i + 1) + '</div>';
    if (heavy) for (var k = 0; k < 12; k++) html += '<div class="card" style="background:linear-gradient(160deg,rgba(45,212,191,.2),rgba(255,255,255,.03))"><canvas width="240" height="120" style="width:100%;height:60%"></canvas></div>';
    pg.innerHTML = html; pager.appendChild(pg);
  }
  // ---- recorder (same for every mode): frame gaps while a finger is down, and touchmove delay ----
  var rec = { gaps: [], delay: [], hand: [], touching: false, last: 0, until: 0 };
  (function loop(ts) { if (rec.touching || ts < rec.until) { if (rec.last) rec.gaps.push(ts - rec.last); rec.last = ts; } else rec.last = 0; requestAnimationFrame(loop); })(0);
  function stats(a) { if (!a.length) return null; var s = a.slice().sort(function (x, y) { return x - y; }), t = 0; a.forEach(function (x) { t += x; }); return { n: a.length, avg: Math.round(t / a.length * 10) / 10, p50: Math.round(s[Math.floor(s.length / 2)] * 10) / 10, p95: Math.round(s[Math.floor(s.length * .95)] * 10) / 10, max: Math.round(s[s.length - 1] * 10) / 10 }; }
  window.__benchStats = function () { var g = stats(rec.gaps.slice(1)); return JSON.stringify({ mode: mode, frameGapMs: g, fps: g ? Math.round(1000 / g.avg * 10) / 10 : null, touchmoveDelayMs: stats(rec.delay), handlerMs: stats(rec.hand) }); };
  window.__benchReset = function () { rec.gaps = []; rec.delay = []; rec.hand = []; return 'reset'; };
  pager.addEventListener('touchstart', function () { rec.touching = true; }, true);
  pager.addEventListener('touchend', function () { rec.touching = false; rec.until = performance.now() + 600; }, true);
  pager.addEventListener('touchcancel', function () { rec.touching = false; }, true);
  if (native) return;
  // ---- JS pager: translate3d, one page per swipe (same approach as the panel) ----
  var off = 0, x0 = 0, y0 = 0, start = 0, lock = '', tracking = false, anim = 0, hist = [];
  function paint(x) { for (var i = 0; i < N; i++) { var t = 'translate3d(' + Math.round(i * W - x) + 'px,0,0)'; pager.children[i].style.webkitTransform = t; } }
  paint(0);
  function glide(to, ms) { if (anim) cancelAnimationFrame(anim); var from = off, t0 = Date.now(); (function step() { var k = Math.min(1, (Date.now() - t0) / ms), e = 1 - Math.pow(1 - k, 3); off = from + (to - from) * e; paint(off); anim = k < 1 ? requestAnimationFrame(step) : 0; })(); }
  pager.addEventListener('touchstart', function (e) { if (anim) { cancelAnimationFrame(anim); anim = 0; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; start = off; lock = ''; tracking = true; hist = [[Date.now(), x0]]; });
  pager.addEventListener('touchmove', function (e) {
    var h0 = performance.now(); if (!tracking) return;
    var d = Date.now() - e.timeStamp; if (d > -1000 && d < 5000) rec.delay.push(d);
    var x = e.touches[0].clientX, dx = x - x0, dy = e.touches[0].clientY - y0;
    if (!lock) { if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; lock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; }
    if (lock !== 'x') return; e.preventDefault();
    var to = start - dx; if (to < 0) to /= 3; else if (to > (N - 1) * W) to = (N - 1) * W + (to - (N - 1) * W) / 3;
    hist.push([Date.now(), x]); if (hist.length > 6) hist.shift();
    off = to; paint(to); rec.hand.push(performance.now() - h0);
  }, false);
  pager.addEventListener('touchend', function () {
    if (!tracking) return; tracking = false; if (lock !== 'x') return;
    var a = hist[0], b = hist[hist.length - 1], v = b[0] > a[0] ? (b[1] - a[1]) / (b[0] - a[0]) : 0, dx = start - off, page = Math.round(start / W);
    if (dx < -W * .18 || v < -.35) page++; else if (dx > W * .18 || v > .35) page--;
    page = Math.max(0, Math.min(N - 1, page)); glide(page * W, 250);
  });
})();
</script></body></html>
