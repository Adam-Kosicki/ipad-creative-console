plugins { id "com.android.application" }

android {
    namespace "com.adamk.tvassistant"
    compileSdk 34
    defaultConfig {
        applicationId "com.adamk.tvassistant"
        minSdk 26
        // 30 on purpose: an always-listening mic service is simpler under Android 11 rules.
        targetSdk 30
        versionCode 1
        versionName "0.1"
        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so it can be sideloaded without a keystore.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.20.0"
}

// openWakeWord models (Apache-2.0 code; the pre-trained models are CC BY-NC-SA 4.0,
// fine for personal use). Downloaded at build time instead of committed.
def modelDir = file("src/main/assets/models")
def models = ["melspectrogram", "embedding_model", "hey_jarvis_v0.1"]
tasks.register("downloadModels") {
    outputs.dir modelDir
    doLast {
        modelDir.mkdirs()
        models.each { m ->
            def out = new File(modelDir, "${m}.onnx")
            if (!out.exists()) {
                ant.get(src: "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/${m}.onnx", dest: out)
            }
        }
    }
}
preBuild.dependsOn downloadModels
